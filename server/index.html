<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>黃毛丫頭叫號系統</title>
  <style>
    :root {
      --primary-yellow: #ffe066;
      --secondary-yellow: #fff8e1;
      --accent-brown: #8B4513;
      --text-dark: #523834;
      --text-light: #8B7355;
      --white: #FFFFFF;
      --shadow-light: rgba(139, 69, 19, 0.1);
      --shadow-medium: rgba(139, 69, 19, 0.15);
      --shadow-heavy: rgba(139, 69, 19, 0.2);
      --border-radius: 20px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--secondary-yellow);
      min-height: 100vh;
      color: var(--text-dark);
      line-height: 1;
    }

    /* Header 設計 */
    header {
      background: var(--primary-yellow);
      padding: 1rem 1rem;
      text-align: center;
      box-shadow: 0 2px 12px var(--shadow-light);
      position: sticky;
      top: 0;
      z-index: 120;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      width: 50%;
      height: auto;
      margin-bottom: 1rem;
      filter: drop-shadow(0 1px 4px var(--shadow-light));
    }

    .title {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-dark);
      margin: 0;
    }

    /* 主要內容容器 */
    .landscape-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 0.5rem;
    }

    /* 左側區域 - SVG 和號碼 */
    .landscape-left {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      margin-bottom: 1.5rem;
      position: relative;
      padding-top: 4rem;
    }

    /* SVG 容器 */
    .svg-wrap {
      width: 80%;
      max-width: 300px;
      height: auto;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      background: transparent;
      padding: 0;
      z-index: 10;
      position: relative;
      cursor: pointer;
      margin-bottom: -40px;
    }

    .duck-container {
      position: relative;
      display: inline-block;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); /* 彈性過渡，平滑銜接 */
      z-index: 5;
      will-change: transform;
    }

    .duck-container:hover {
      transform: scale(1.05);
    }

    .hearts-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 999;
      overflow: visible;
    }

    .heart {
      position: absolute;
      width: 30px !important;
      height: auto;
      max-width: none;
      will-change: transform;
    }

    @keyframes duckBounce {
      0%, 100% { transform: scale(1) rotate(0deg); }
      25% { transform: scale(1.1) rotate(-5deg); }
      50% { transform: scale(1.05) rotate(5deg); }
      75% { transform: scale(1.1) rotate(-3deg); }
    }


    .eye-part {
      animation: pixelBlink 3s ease-in-out infinite;
    }

    /* 垂直排列的眼睛需要配合動畫 - 眼瞼從上往下閉合 */
    /* 閉眼：第一顆先閉，第二顆緊接著閉 */
    /* 睜眼：第二顆先開，第一顆再開 */
    #eyePart1 {
      animation-delay: 0s; /* 第一顆先閉眼 */
    }

    #eyePart2 {
      animation-delay: 0.25s; /* 第二顆延遲閉眼，但先睜眼（延遲更長，效果更明顯） */
    }

    @keyframes pixelBlink {
      0%, 90% {
        height: 20.68px; /* 2個方塊 - 睜眼 */
        transform: translateY(0);
      }
      92% {
        height: 10.34px; /* 1個方塊 - 半閉眼 */
        transform: translateY(10.34px); /* 向下移動，從頂部縮小 */
      }
      94% {
        height: 0px; /* 0個方塊 - 完全閉眼 */
        transform: translateY(20.68px); /* 繼續向下移動 */
      }
      96% {
        height: 10.34px; /* 1個方塊 - 半閉眼 */
        transform: translateY(10.34px); /* 向上移動 */
      }
      98%, 100% {
        height: 20.68px; /* 2個方塊 - 睜眼 */
        transform: translateY(0); /* 回到原位 */
      }
    }

    .duck-container.blinking .eye-part {
      animation: pixelBlinkFast 0.3s ease-in-out;
      animation-fill-mode: none; /* 動畫結束後不保留狀態，允許立即重新觸發 */
    }

    /* 點擊時也保持延遲效果 */
    .duck-container.blinking #eyePart1 {
      animation-delay: 0s; /* 第一顆先閉眼 */
    }

    .duck-container.blinking #eyePart2 {
      animation-delay: 0.1s; /* 第二顆延遲閉眼，但先睜眼（快速眨眼時延遲較短） */
    }

    @keyframes pixelBlinkFast {
      0% {
        height: 20.68px; /* 2個方塊 */
        transform: translateY(0);
      }
      33% {
        height: 10.34px; /* 1個方塊 */
        transform: translateY(10.34px); /* 向下移動，從頂部縮小 */
      }
      66% {
        height: 0px; /* 0個方塊 */
        transform: translateY(20.68px); /* 繼續向下移動 */
      }
      100% {
        height: 20.68px; /* 2個方塊 */
        transform: translateY(0); /* 回到原位 */
      }
    }

    .svg-wrap svg {
      width: 100%;
      height: auto;
      max-width: 300px;
      display: block;
    }


         /* 當前號碼顯示 */
         .current-number {
           font-size: 4rem;
           font-weight: 800;
           color: var(--text-dark);
           background: var(--white);
           padding: 1rem 2rem;
           border-radius: var(--border-radius);
           box-shadow: 0 12px 40px var(--shadow-medium);
           text-align: center;
           min-width: 200px;
           position: relative;
           margin: 2rem auto 0 auto;
           z-index: 1;
         }



    /* 右側區域 - 標籤和列表 */
    .landscape-right {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    /* 標籤切換 */
    .tabs {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
      background: var(--white);
      padding: 0.5rem;
      border-radius: var(--border-radius);
      box-shadow: 0 4px 16px var(--shadow-light);
    }

    .tab {
      padding: 0.75rem 1.5rem;
      border: none;
      background: transparent;
      color: var(--text-light);
      font-size: 1rem;
      font-weight: 600;
      border-radius: calc(var(--border-radius) - 4px);
      cursor: pointer;
      transition: var(--transition);
      position: relative;
    }

    .tab:hover {
      color: var(--text-dark);
      background: var(--secondary-yellow);
    }

    .tab.active {
      color: var(--text-dark);
      background: var(--primary-yellow);
      box-shadow: 0 2px 8px var(--shadow-medium);
    }

    /* 摘要資訊 */
    .summary {
      font-size: 1.1rem;
      color: var(--text-light);
      margin-top: 1rem;
      margin-bottom: 1.5rem;
      text-align: center;
      font-weight: 500;
    }

    /* 列表容器 */
    .list {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    /* 列表項目 */
    .item {
      background: var(--white);
      border-radius: var(--border-radius);
      box-shadow: 0 4px 16px var(--shadow-light);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.1rem;
      font-weight: 600;
      transition: var(--transition);
      border-left: 4px solid var(--primary-yellow);
    }

    .item:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px var(--shadow-medium);
    }

    .item span:first-child {
      color: var(--text-dark);
      font-weight: 700;
    }

    .item span:last-child {
      color: var(--text-light);
      font-weight: 500;
    }

    .hidden {
      display: none;
    }

    .ad-container {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      z-index: 999;
      background: white;
      box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
    }
    .adsbygoogle {
      display: block;
      width: 100%;
      height: 30px;
      margin: 0 auto;
    }
    
    /* 響應式設計 */
    @media (max-width: 768px) {
      .landscape-container {
        padding: 1rem 0.5rem;
      }

      .landscape-left {
        padding-top: 2rem;
      }

      .svg-wrap {
        width: 80%;
        max-width: 200px;
        margin-bottom: -30px;
      }

      .current-number {
        font-size: 3rem;
        padding: 1.5rem 2rem;
        min-width: 160px;
        position: relative;
      }

      .tabs {
        gap: 0.5rem;
        padding: 0.25rem;
      }

      .tab {
        padding: 0.5rem 1rem;
        font-size: 0.9rem;
      }

      .item {
        padding: 1rem 1.25rem;
        font-size: 1rem;
      }
    }

    /* 橫屏佈局 */
    @media (orientation: landscape) and (min-width: 768px) {
      .landscape-container {
        flex-direction: row;
        align-items: flex-start;
        gap: 2rem;
        padding: 2rem 1.5rem;
      }

      .landscape-left {
        flex: 0 0 45%;
        margin-bottom: 0;
      }

      .landscape-right {
        flex: 0 0 55%;
      }

      .svg-wrap {
        width: 80%;
        max-width: 250px;
        margin-bottom: -40px;
      }

      .current-number {
        font-size: 5rem;
        padding: 2.5rem 4rem;
        position: relative;
      }

      .tabs {
        margin-bottom: 2rem;
      }

      .summary {
        margin: 1.5rem 0 2rem 0;
        max-width: 100%;
      }

      .list {
        max-width: 100%;
      }
    }

    /* 手機橫屏優化 */
    @media (orientation: landscape) and (max-height: 500px) {
      .landscape-container {
        padding: 1.5rem;
        gap: 1rem;
      }

      .svg-wrap {
        width: 80%;
        max-width: 180px;
        margin-bottom: -30px;
      }

      .current-number {
        font-size: 3rem;
        padding: 1.5rem 2.5rem;
        position: relative;
      }

      .tabs {
        margin-bottom: 1.5rem;
      }

      .tab {
        padding: 0.5rem 1rem;
        font-size: 0.9rem;
      }

      .item {
        padding: 1rem 1.25rem;
        font-size: 1rem;
      }
    }

    /* 大螢幕優化 */
    @media (min-width: 1200px) {
      .landscape-container {
        max-width: 1400px;
        padding: 2.5rem 2rem;
      }

      .svg-wrap {
        width: 80%;
        max-width: 300px;
        margin-bottom: -50px;
      }

      .current-number {
        font-size: 6rem;
        padding: 3rem 5rem;
        position: relative;
      }

      .tabs {
        margin-bottom: 3rem;
      }

      .tab {
        padding: 1rem 2rem;
        font-size: 1.1rem;
      }

      .item {
        padding: 1.5rem 2rem;
        font-size: 1.2rem;
      }
    }

    /* 動畫效果 */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .landscape-left,
    .landscape-right {
      animation: fadeInUp 0.6s ease-out;
    }

    .landscape-right {
      animation-delay: 0.2s;
    }

    /* 懸停效果增強 */
    .current-number:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 48px var(--shadow-medium);
      transition: var(--transition);
    }

  </style>

  <script>
    let currentTab = 'waiting';

    // 鴨子互動功能
    let duckContainer = null;
    let blinkInterval = null;
    let heartsContainer = null;
    let hearts = []; // 存儲所有活動的愛心
    let bounceTimeouts = []; // 追蹤動畫 timeout，用於清理

    function initDuckInteraction() {
      duckContainer = document.getElementById('duckContainer');
      heartsContainer = document.getElementById('heartsContainer');

      if (duckContainer) {
        // 點擊事件
        duckContainer.addEventListener('click', function(e) {
          e.preventDefault();
          duckClicked();
        });

        // 觸摸事件（手機優先）
        duckContainer.addEventListener('touchstart', function(e) {
          e.preventDefault();
          duckClicked();
        });

        // 開始自動眨眼
        startAutoBlink();
      }

      // 開始愛心動畫循環
      if (heartsContainer) {
        animateHearts();
      }
    }

    function duckClicked() {
      if (!duckContainer) return;

      // 清除之前的動畫 timeout，讓新動畫從當前狀態平滑銜接
      bounceTimeouts.forEach(timeout => clearTimeout(timeout));
      bounceTimeouts = [];

      // 創建彈跳動畫序列（快速點擊時會從當前狀態平滑過渡）
      const bounceSequence = [
        { scale: 1.12, rotate: -6, delay: 0 },
        { scale: 1.05, rotate: 4, delay: 80 },
        { scale: 1.1, rotate: -3, delay: 160 },
        { scale: 1, rotate: 0, delay: 240 }
      ];

      // 執行動畫序列（使用 transition 平滑過渡）
      bounceSequence.forEach((step) => {
        const timeout = setTimeout(() => {
          duckContainer.style.transform = `scale(${step.scale}) rotate(${step.rotate}deg)`;
        }, step.delay);
        bounceTimeouts.push(timeout);
      });

      // 觸發眨眼（允許快速點擊時多次眨眼）
      blink();

      // 添加音效（如果支持）
      playDuckSound();

      // 創建3顆愛心
      createHearts(3);
    }

    function blink() {
      // 如果正在眨眼，先重置動畫以允許快速連續眨眼
      if (duckContainer.classList.contains('blinking')) {
        duckContainer.classList.remove('blinking');
        // 強制重排以確保動畫重置
        void duckContainer.offsetWidth;
      }

      // 添加眨眼動畫類
      duckContainer.classList.add('blinking');

      // 使用 animationend 事件來移除類別
      const handleBlinkEnd = (e) => {
        if (e.animationName === 'pixelBlinkFast') {
          duckContainer.classList.remove('blinking');
          duckContainer.removeEventListener('animationend', handleBlinkEnd);
        }
      };
      duckContainer.addEventListener('animationend', handleBlinkEnd);
    }

    function startAutoBlink() {
      // 每3-8秒隨機眨眼
      function scheduleBlink() {
        const delay = 3000 + Math.random() * 5000; // 3-8秒
        blinkInterval = setTimeout(() => {
          blink(); // 移除 isBlinking 檢查，允許與點擊眨眼同時進行
          scheduleBlink(); // 繼續下一個眨眼
        }, delay);
      }

      scheduleBlink();
    }

    function playDuckSound() {
      // 使用Web Audio API創建簡單的鴨子叫聲
      try {
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();

        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);

        // 鴨子叫聲頻率
        oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
        oscillator.frequency.setValueAtTime(600, audioContext.currentTime + 0.1);
        oscillator.frequency.setValueAtTime(800, audioContext.currentTime + 0.2);

        gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);

        oscillator.start(audioContext.currentTime);
        oscillator.stop(audioContext.currentTime + 0.3);
      } catch (e) {
        // 如果音效失敗，靜默處理
        console.log('音效播放失敗');
      }
    }

    // 創建愛心
    function createHearts(count) {
      if (!heartsContainer || !duckContainer) return;

      // 獲取鴨子的位置
      const duckRect = duckContainer.getBoundingClientRect();
      const startX = duckRect.left + duckRect.width / 2;
      const startY = duckRect.top + duckRect.height / 2;

      for (let i = 0; i < count; i++) {
        // 創建愛心元素
        const heartWrapper = document.createElement('div');
        heartWrapper.className = 'heart';
        heartWrapper.innerHTML = getHeartSVG();
        heartWrapper.style.position = 'absolute';
        heartWrapper.style.left = startX + 'px';
        heartWrapper.style.top = startY + 'px';
        heartWrapper.style.opacity = '1';
        heartWrapper.style.transformOrigin = 'center center';
        
        heartsContainer.appendChild(heartWrapper);

        // 隨機初始速度（向上和側向）- 大幅增加噴射力度
        const velocityX = (Math.random() - 0.5) * 800; // -400 到 400 (極大側向速度)
        const velocityY = -350 - Math.random() * 150; // -500 到 -350 (適中的向上速度)
        const rotation = (Math.random() - 0.5) * 360; // 隨機旋轉
        const rotationSpeed = (Math.random() - 0.5) * 900; // 旋轉速度 (度/秒，-450 到 450)

        // 添加到愛心數組 - 添加物理屬性
        hearts.push({
          element: heartWrapper,
          x: startX,
          y: startY,
          velocityX: velocityX,
          velocityY: velocityY,
          rotation: rotation,
          rotationSpeed: rotationSpeed,
          gravity: 980, // 重力加速度 (px/s²) - 接近真實重力
          airResistance: 0.98, // 空氣阻力係數 (每幀速度衰減)
          bounceDamping: 0.7, // 彈跳阻尼係數 (0-1，增加彈跳力度)
          rotationDamping: 0.995, // 旋轉阻尼 (旋轉會逐漸減慢)
          opacity: 1,
          bounceCount: 0, // 彈跳次數
          maxBounces: 3, // 最大彈跳次數
          size: 1, // 愛心大小（用於縮放效果）
          age: 0, // 愛心年齡（用於淡出）
          stoppedTime: null // 停止時間（用於淡出計算）
        });
      }
    }

    // 愛心動畫循環 - 優化物理效果
    function animateHearts() {
      const now = performance.now();
      const deltaTime = (now - (animateHearts.lastTime || now)) / 1000; // 轉換為秒
      animateHearts.lastTime = now;

      // 獲取螢幕邊界
      const screenHeight = window.innerHeight;
      const screenWidth = window.innerWidth;
      const bottomBoundary = screenHeight - 15; // 底部邊界（考慮愛心大小）
      const heartSize = 30; // 愛心大小的一半（用於碰撞檢測）
      
      hearts = hearts.filter(heart => {
        // 增加年齡
        heart.age += deltaTime;

        // 應用重力
        heart.velocityY += heart.gravity * deltaTime;

        // 應用空氣阻力（速度越大，阻力越大）
        // 使用基於時間的阻力，確保在不同幀率下表現一致
        const resistanceFactor = Math.pow(heart.airResistance, deltaTime * 60); // 基於60fps的阻力
        heart.velocityX *= resistanceFactor;
        heart.velocityY *= resistanceFactor;

        // 更新位置
        heart.x += heart.velocityX * deltaTime;
        heart.y += heart.velocityY * deltaTime;

        // 左右邊界碰撞（彈性碰撞）- 極大增強反彈效果
        const wallBounceDamping = 0.9; // 邊界反彈阻尼（幾乎完全反彈，保留90%能量）
        if (heart.x < heartSize) {
          heart.x = heartSize;
          heart.velocityX = -heart.velocityX * wallBounceDamping; // 強力反彈
          // 碰撞時大幅增加旋轉變化，讓反彈更明顯
          heart.rotationSpeed += (Math.random() - 0.5) * 15;
        } else if (heart.x > screenWidth - heartSize) {
          heart.x = screenWidth - heartSize;
          heart.velocityX = -heart.velocityX * wallBounceDamping; // 強力反彈
          heart.rotationSpeed += (Math.random() - 0.5) * 15;
        }

        // 底部碰撞（彈跳效果）
        if (heart.y >= bottomBoundary && heart.velocityY > 0) {
          // 只有在向下移動時才彈跳
          if (heart.bounceCount < heart.maxBounces && Math.abs(heart.velocityY) > 50) {
            // 彈跳：反轉速度並應用阻尼
            heart.velocityY = -heart.velocityY * heart.bounceDamping;
            heart.velocityX *= 0.9; // 水平速度也稍微減弱
            heart.y = bottomBoundary;
            heart.bounceCount++;
            
            // 彈跳時增加旋轉變化
            heart.rotationSpeed += (Math.random() - 0.5) * 5;
            
            // 每次彈跳後減少彈跳係數（模擬能量損失）
            heart.bounceDamping *= 0.85;
          } else {
            // 不再彈跳，停在底部並逐漸減速
            heart.y = bottomBoundary;
            heart.velocityY = 0;
            heart.velocityX *= 0.95; // 水平摩擦力
            if (Math.abs(heart.velocityX) < 5) {
              heart.velocityX = 0;
              // 記錄停止時間
              if (heart.stoppedTime === null) {
                heart.stoppedTime = heart.age;
              }
            }
          }
        }

        // 更新旋轉（應用旋轉阻尼）
        heart.rotation += heart.rotationSpeed * deltaTime; // rotationSpeed 已經是度/秒
        heart.rotationSpeed *= Math.pow(heart.rotationDamping, deltaTime * 60);

        // 淡出效果：基於年齡和停止時間
        if (heart.stoppedTime !== null) {
          // 停止後0.5秒開始淡出，1秒內完成
          const timeSinceStop = heart.age - heart.stoppedTime;
          if (timeSinceStop > 0.5) {
            const fadeProgress = Math.min(1, (timeSinceStop - 0.5) / 1);
            heart.opacity = 1 - fadeProgress;
          }
        } else {
          // 正常淡出：5秒後開始淡出，2秒內完成
          const fadeStartAge = 5;
          const fadeDuration = 2;
          if (heart.age > fadeStartAge) {
            const fadeProgress = Math.min(1, (heart.age - fadeStartAge) / fadeDuration);
            heart.opacity = 1 - fadeProgress;
          }
        }

        // 更新元素樣式
        heart.element.style.left = (heart.x - heartSize) + 'px';
        heart.element.style.top = (heart.y - heartSize) + 'px';
        heart.element.style.transform = `rotate(${heart.rotation}deg) scale(${heart.size})`;
        heart.element.style.opacity = heart.opacity;

        // 移除條件：完全透明或超出螢幕很遠
        if (heart.opacity <= 0 || heart.y > screenHeight + 500 || heart.x < -500 || heart.x > screenWidth + 500) {
          heart.element.remove();
          return false;
        }

        return true;
      });

      // 繼續動畫
      animationId = requestAnimationFrame(animateHearts);
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelector('.tab:nth-child(' + (tab === 'waiting' ? 1 : 2) + ')').classList.add('active');
      document.getElementById('waitingList').classList.toggle('hidden', tab !== 'waiting');
      document.getElementById('missedList').classList.toggle('hidden', tab !== 'missed');
    }

    async function refresh() {
      try {
        const r = await fetch('/status');
        if (!r.ok) throw new Error();
        const j = await r.json();

        document.getElementById('num').textContent = j.current?.toString().padStart(3, '0') ?? '--';

        const waitList = document.getElementById('waitingList');
        waitList.innerHTML = '';
        j.waiting.forEach((n, i) => {
          const div = document.createElement('div');
          div.className = 'item';
          const eta = (i + 1) * (j.waiting.length <= 5 ? 1 : j.waiting.length <= 10 ? 2 : 3);
          div.innerHTML = `<span>${n.toString().padStart(3, '0')}</span><span>等候時間 ${eta} 分</span>`;
          waitList.appendChild(div);
        });

        // 只在載入時隨機選一句，之後不再更換
        if (!window._summaryMsgIndex) {
          const summaryMsgs = [
            `等候 ${j.waiting.length} 人 (｡•ᴗ•｡)♡`,
            `還有 ${j.waiting.length} 位唷～`,
            `排隊 ${j.waiting.length} 人，先逛逛吧！`,
            `前面有 ${j.waiting.length} 人，請耐心等候！`,
            `目前 ${j.waiting.length} 人在等`
          ];
          window._summaryMsgIndex = Math.floor(Math.random() * summaryMsgs.length);
          window._summaryMsgs = summaryMsgs;
        }
        // 每次只顯示同一句
        document.getElementById('summary').textContent = window._summaryMsgs[window._summaryMsgIndex];

        const missList = document.getElementById('missedList');
        missList.innerHTML = '';
        j.missed.forEach(n => {
          const div = document.createElement('div');
          div.className = 'item';
          div.innerHTML = `<span>${n.toString().padStart(3, '0')}</span><span>未報到</span>`;
          missList.appendChild(div);
        });

      } catch {
        document.getElementById('summary').textContent = '🚫 連線失敗';
      }
    }

    window.onload = () => {
      refresh();
      setInterval(refresh, 2000);

      // 初始化鴨子互動
      initDuckInteraction();

      try {
        (adsbygoogle = window.adsbygoogle || []).push({});
      } catch (e) {
        console.warn("AdSense 無法顯示", e);
      }
    };
