<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>號碼單</title>
  <style>
    @media print {
      body {
        margin: 0;
      }
    }
    body {
      width: 5.7cm;
      height: 9cm;
      margin: 0;
      padding: 0.4cm;
      font-family: "Arial", sans-serif;
      background: white;
      color: black;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
    }
    .logo, .footer-icon {
      width: 100%;
      height: 1.5cm;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .logo svg, .footer-icon svg {
      height: 100%;
      width: auto;
      fill: black;
    }
    .content {
      text-align: center;
    }
    .number-box {
      display: inline-block;
      background-color: black;
      color: white;
      padding: 0.2cm 0.6cm;
      border-radius: 12px;
      font-size: 2em;
      font-weight: bold;
      margin: 0.4cm 0;
    }
    .info {
      font-size: 0.9em;
      margin-bottom: 0.4cm;
    }
    .qrcode {
      width: 3.5cm;
      height: 3.5cm;
      margin: 0 auto 0.2cm;
    }
    img.qrcode {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="logo">
    <!-- ✅ 上方 LOGO SVG -->
    <svg viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="40" stroke="black" stroke-width="8" fill="none" />
      <text x="50%" y="55%" text-anchor="middle" font-size="32" fill="black" font-family="Arial">LOGO</text>
    </svg>
  </div>

  <div class="content">
    <div class="number-box">No. 0123</div>
    <div class="info">
      預估等待時間：約 15 分鐘<br>
      目前候位人數：8 人
    </div>
    <!-- ✅ QR Code 生成（用任意網址 API） -->
    <div class="qrcode">
      <img class="qrcode" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://your-website.com/status" alt="QRCode">
    </div>
  </div>

  <div class="footer-icon">
    <!-- ✅ 底部裝飾 SVG -->
    <svg viewBox="0 0 100 100">
      <rect x="10" y="40" width="80" height="20" fill="black" />
      <text x="50%" y="65%" text-anchor="middle" font-size="16" fill="white" font-family="Arial">Thank You</text>
    </svg>
  </div>
</body>
</html>
