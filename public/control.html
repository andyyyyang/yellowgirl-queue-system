<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>叫號系統管理控制台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
            background: #1a1a1a;
            color: white;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .status-card {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        
        .status-card h3 {
            font-size: 16px;
            margin-bottom: 15px;
            color: #ccc;
        }
        
        .current-number {
            font-size: 48px;
            font-weight: bold;
            color: #ffe066;
        }
        
        .next-number {
            font-size: 32px;
            font-weight: bold;
            color: #4CAF50;
        }
        
        .queue-info {
            background: #2d2d2d;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
        }
        
        .queue-info h3 {
            margin-bottom: 15px;
            color: #ccc;
        }
        
        .queue-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .queue-item {
            background: #3d3d3d;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
        
        .missed-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }
        
        .missed-item {
            background: #ff5722;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
        
        .control-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .control-btn {
            background: #3d3d3d;
            border: none;
            color: white;
            padding: 20px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
        }
        
        .control-btn:hover, .control-btn:active {
            background: #4d4d4d;
            transform: translateY(-2px);
        }
        
        .control-btn.primary {
            background: #4CAF50;
        }
        
        .control-btn.primary:hover, .control-btn.primary:active {
            background: #45a049;
        }
        
        .control-btn.danger {
            background: #f44336;
        }
        
        .control-btn.danger:hover, .control-btn.danger:active {
            background: #da190b;
        }
        
        .control-btn.warning {
            background: #ff9800;
        }
        
        .control-btn.warning:hover, .control-btn.warning:active {
            background: #e68900;
        }
        
        .action-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        
        .action-btn {
            background: #2d2d2d;
            border: none;
            color: white;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            user-select: none;
        }
        
        .action-btn:hover, .action-btn:active {
            background: #3d3d3d;
        }
        
        .action-btn.danger {
            background: #ff5722;
        }
        
        .action-btn.danger:hover, .action-btn.danger:active {
            background: #e64a19;
        }
        
        .status-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 1rem;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        .status-indicator.success {
            background: #4CAF50;
            color: white;
        }
        
        .status-indicator.error {
            background: #f44336;
            color: white;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 15px;
            }
            
            .header h1 {
                font-size: 20px;
            }
            
            .status-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .status-card {
                padding: 15px;
            }
            
            .current-number {
                font-size: 36px;
            }
            
            .next-number {
                font-size: 28px;
            }
            
            .queue-info {
                padding: 15px;
            }
            
            .queue-list, .missed-list {
                grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
                gap: 8px;
            }
            
            .queue-item, .missed-item {
                padding: 8px;
                font-size: 16px;
            }
            
            .control-buttons {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            
            .control-btn {
                padding: 18px;
                font-size: 16px;
                min-height: 60px;
            }
            
            .action-buttons {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            
            .action-btn {
                padding: 18px;
                font-size: 16px;
                min-height: 50px;
            }
            
            .status-indicator {
                top: 15px;
                right: 15px;
                left: 15px;
                text-align: center;
                font-size: 13px;
                padding: 12px 15px;
            }
        }
        
        @media (max-width: 480px) {
            .header h1 {
                font-size: 18px;
            }
            
            .current-number {
                font-size: 32px;
            }
            
            .next-number {
                font-size: 24px;
            }
            
            .status-indicator {
                top: 10px;
                right: 10px;
                left: 10px;
                font-size: 12px;
                padding: 10px 15px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎫 叫號系統管理控制台</h1>
        <p>即時監控和控制叫號狀態</p>
    </div>
    
    <div class="status-grid">
        <div class="status-card">
            <h3>目前叫號</h3>
            <div class="current-number" id="currentNumber">-</div>
        </div>
        <div class="status-card">
            <h3>下一個號碼</h3>
            <div class="next-number" id="nextNumber">-</div>
        </div>
    </div>
    
    <div class="queue-info">
        <h3>等待佇列 (<span id="waitingCount">0</span>)</h3>
        <div class="queue-list" id="waitingList">
            <div class="queue-item">無等待號碼</div>
        </div>
        
        <h3>錯過佇列 (<span id="missedCount">0</span>)</h3>
        <div class="missed-list" id="missedList">
            <div class="queue-item">無錯過號碼</div>
        </div>
    </div>
    
    <div class="control-buttons">
        <button class="control-btn primary" onclick="takeNumber()">
            ➕ 取號
        </button>
        <button class="control-btn warning" onclick="nextNumber()">
            ➡️ 下一個
        </button>
        <button class="control-btn danger" onclick="markMissed()">
            ⏰ 過號
        </button>
    </div>
    
    <div class="action-buttons">
        <button class="action-btn" onclick="goPrevious()">
            ↩️ 返回前一號
        </button>
        <button class="action-btn danger" onclick="manualReset()">
            🔄 手動歸零
        </button>
    </div>
    
    <div class="status-indicator" id="statusIndicator"></div>
    
    <script>
        // 更新狀態顯示
        function updateStatus() {
            fetch('https://us-central1-yellowgirlqueueserver.cloudfunctions.net/status')
                .then(response => response.json())
                .then(data => {
                    // 更新目前叫號
                    document.getElementById('currentNumber').textContent = data.current || '-';
                    
                    // 更新下一個號碼
                    document.getElementById('nextNumber').textContent = data.next_no;
                    
                    // 更新等待佇列
                    const waitingList = document.getElementById('waitingList');
                    const waitingCount = document.getElementById('waitingCount');
                    
                    if (data.waiting && data.waiting.length > 0) {
                        waitingCount.textContent = data.waiting.length;
                        waitingList.innerHTML = data.waiting.map(num => 
                            `<div class="queue-item">${num}</div>`
                        ).join('');
                    } else {
                        waitingCount.textContent = '0';
                        waitingList.innerHTML = '<div class="queue-item">無等待號碼</div>';
                    }
                    
                    // 更新錯過佇列
                    const missedList = document.getElementById('missedList');
                    const missedCount = document.getElementById('missedCount');
                    
                    if (data.missed && data.missed.length > 0) {
                        missedCount.textContent = data.missed.length;
                        missedList.innerHTML = data.missed.map(num => 
                            `<div class="missed-item">${num}</div>`
                        ).join('');
                    } else {
                        missedCount.textContent = '0';
                        missedList.innerHTML = '<div class="queue-item">無錯過號碼</div>';
                    }
                })
                .catch(error => {
                    console.error('更新狀態失敗:', error);
                });
        }
        
        // 顯示狀態訊息
        function showStatus(message, type = 'success') {
            const indicator = document.getElementById('statusIndicator');
            indicator.textContent = message;
            indicator.className = `status-indicator ${type}`;
            indicator.style.opacity = '1';
            
            setTimeout(() => {
                indicator.style.opacity = '0';
            }, 3000);
        }
        
        // 取號
        function takeNumber() {
            fetch('https://us-central1-yellowgirlqueueserver.cloudfunctions.net/take', { method: 'POST' })
                .then(response => {
                    if (response.ok) {
                        showStatus('✅ 成功取號');
                        updateStatus();
                    } else {
                        showStatus('❌ 取號失敗', 'error');
                    }
                })
                .catch(error => {
                    console.error('取號失敗:', error);
                    showStatus('❌ 取號失敗', 'error');
                });
        }
        
        // 下一個號碼
        function nextNumber() {
            fetch('https://us-central1-yellowgirlqueueserver.cloudfunctions.net/next', { method: 'POST' })
                .then(response => {
                    if (response.ok) {
                        showStatus('✅ 已叫下一個號碼');
                        updateStatus();
                    } else {
                        showStatus('❌ 叫號失敗', 'error');
                    }
                })
                .catch(error => {
                    console.error('叫號失敗:', error);
                    showStatus('❌ 叫號失敗', 'error');
                });
        }
        
        // 標記過號
        function markMissed() {
            fetch('https://us-central1-yellowgirlqueueserver.cloudfunctions.net/miss', { method: 'POST' })
                .then(response => {
                    if (response.ok) {
                        showStatus('✅ 已標記過號');
                        updateStatus();
                    } else {
                        showStatus('❌ 標記過號失敗', 'error');
                    }
                })
                .catch(error => {
                    console.error('標記過號失敗:', error);
                    showStatus('❌ 標記過號失敗', 'error');
                });
        }
        
        // 返回前一號
        function goPrevious() {
            fetch('https://us-central1-yellowgirlqueueserver.cloudfunctions.net/previous', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'ok') {
                        showStatus('✅ ' + data.message);
                        updateStatus();
                    } else {
                        showStatus('❌ ' + data.error, 'error');
                    }
                })
                .catch(error => {
                    console.error('返回前一號失敗:', error);
                    showStatus('❌ 返回前一號失敗', 'error');
                });
        }
        
        // 手動歸零
        function manualReset() {
            if (confirm('確定要手動歸零嗎？這將清空所有狀態！')) {
                fetch('https://us-central1-yellowgirlqueueserver.cloudfunctions.net/reset', { method: 'POST' })
                    .then(response => response.json())
                    .then(data => {
                        if (data.status === 'ok') {
                            showStatus('✅ ' + data.message);
                            updateStatus();
                        } else {
                            showStatus('❌ 歸零失敗', 'error');
                        }
                    })
                    .catch(error => {
                        console.error('歸零失敗:', error);
                        showStatus('❌ 歸零失敗', 'error');
                    });
            }
        }
        
        // 頁面載入時更新狀態
        updateStatus();
        
        // 每 3 秒自動更新狀態
        setInterval(updateStatus, 3000);
    </script>
</body>
</html>
